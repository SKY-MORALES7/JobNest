<!-- Generated placeholder: purple Spider‑Verse–style cityscape -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%">
      <stop offset="0%" stop-color="#ffd6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#glow)" />

  <!-- distant skyline silhouettes -->
  <g transform="translate(0,520) scale(1,0.5)" opacity="0.6">
    <rect x="0" y="60" width="120" height="200" fill="#2b2b4a" />
    <rect x="140" y="20" width="90" height="240" fill="#332a63" />
    <rect x="260" y="80" width="60" height="180" fill="#2e254f" />
    <rect x="340" y="0" width="140" height="260" fill="#3b2b6b" />
    <rect x="520" y="40" width="80" height="220" fill="#3a305f" />
    <rect x="640" y="30" width="110" height="230" fill="#2f2450" />
    <rect x="780" y="10" width="140" height="250" fill="#3b2b6b" />
    <rect x="960" y="60" width="200" height="200" fill="#2b1f49" />
    <rect x="1180" y="20" width="120" height="240" fill="#372758" />
    <rect x="1320" y="70" width="160" height="190" fill="#2c2048" />
    <rect x="1520" y="0" width="220" height="260" fill="#412f69" />
    <rect x="1760" y="40" width="160" height="220" fill="#2f224f" />
  </g>

  <!-- foreground stylized buildings with neon edges -->
  <g transform="translate(0,420)">
    <rect x="80" y="120" width="160" height="460" rx="8" fill="#1f1336" stroke="#7c3aed" stroke-width="4" opacity="0.95"/>
    <rect x="260" y="180" width="140" height="400" rx="6" fill="#24133b" stroke="#a78bfa" stroke-width="3" opacity="0.95"/>
    <rect x="420" y="90" width="200" height="490" rx="10" fill="#180f2f" stroke="#6d28d9" stroke-width="4" opacity="0.98"/>
    <rect x="640" y="160" width="120" height="420" rx="4" fill="#23123a" stroke="#c084fc" stroke-width="2" opacity="0.95"/>
    <rect x="780" y="140" width="220" height="440" rx="12" fill="#1b0f2a" stroke="#7c3aed" stroke-width="4" opacity="0.98"/>
    <rect x="1020" y="200" width="180" height="380" rx="6" fill="#2a1236" stroke="#a78bfa" stroke-width="3" opacity="0.95"/>
    <rect x="1240" y="100" width="260" height="480" rx="10" fill="#170f2b" stroke="#6d28d9" stroke-width="4" opacity="0.98"/>
  </g>

  <!-- stylized moon and neon particles -->
  <circle cx="1450" cy="180" r="80" fill="#e9d5ff" opacity="0.12" />
  <g fill="#fff" opacity="0.9">
    <circle cx="300" cy="80" r="2"/>
    <circle cx="360" cy="50" r="1.5"/>
    <circle cx="420" cy="120" r="2.2"/>
    <circle cx="1500" cy="60" r="1.8"/>
  </g>

  <!-- subtle foreground gradient overlay -->
  <rect width="100%" height="100%" fill="url(#bg)" opacity="0.08" />

  <!-- caption (hidden for UI but useful for accessibility) -->
  <title>Purple Spiderverse-style cityscape placeholder</title>
</svg>
